# Configuração do Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/odysplay?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Driver do MySQL (opcional, o Spring Boot detecta automaticamente pelo URL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA
# update: Cria as tabelas automaticamente e atualiza a estrutura sem apagar os dados existentes
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL geradas pelo Hibernate no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do banco de dados (ajuda a otimizar o SQL gerado para MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
